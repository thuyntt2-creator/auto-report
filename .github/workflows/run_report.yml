name: Daily Auto Report

on:
  schedule:
    # 00:00 UTC is 07:00 AM Vietnam time (GMT+7)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client requests pytz playwright pillow python-dotenv

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run Report Script
        env:
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
        run: |
          python report_BC_BatOn_html_23.py
